name: Publicar imagen Docker

# Construye y publica la imagen en GitHub Container Registry (ghcr.io) en cada push
# a main. Watchtower, corriendo en local vía docker-compose.yml, vigila esa imagen y
# actualiza el contenedor solo cuando detecta una nueva — no hace falta ningún paso
# manual más allá de hacer push.
#
# Se publica para **amd64 y arm64**. Sin arm64, un Mac con Apple Silicon no puede ni
# descargar la imagen ("no matching manifest for linux/arm64/v8"), así que Watchtower
# no podría actualizar el contenedor ahí. Cada arquitectura se construye en su propio
# runner nativo (gratis en repos públicos) en vez de emular con QEMU, que multiplica
# por varias veces el tiempo de compilación.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Cada arquitectura se construye en paralelo, en su runner nativo, y publica una
  # imagen sin etiqueta identificada por su digest. El job de abajo las une.
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar por digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # La caché se separa por arquitectura: compartirla haría que una pisara a la
          # otra en cada ejecución.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Guardar el digest
        # El recorte del prefijo "sha256:" es sintaxis de bash, no de las expresiones
        # de Actions: hay que pasar el valor a una variable antes.
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Subir el digest como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Une los digests de ambas arquitecturas bajo una sola etiqueta, de modo que
  # `docker pull` reciba automáticamente la que corresponda a su máquina.
  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar los digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Crear la lista de manifiestos
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Comprobar el resultado
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
